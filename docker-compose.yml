# Local testing on a PC with an NVIDIA GPU (needs the NVIDIA Container Toolkit).
# Build:   docker compose build
# Run:     docker compose up
# Open:    https://localhost:6901   (accept the self-signed cert)
# Login:   user "kasm_user", password = VNC_PW below.
services:
  faceflow:
    build:
      context: .
      args:
        BASE_TAG: ${BASE_TAG:-1.16.1}
    image: faceflow:latest
    ports:
      - "6901:6901"   # KasmVNC desktop (browser, HTTPS)
      - "7860:7860"   # FaceFusion web UI
    environment:
      - VNC_PW=${FACEFLOW_PASSWORD:?set FACEFLOW_PASSWORD in .env}
    volumes:
      - faceflow-workspace:/workspace
    shm_size: "2gb"          # Chrome needs more than the 64MB default
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  faceflow-workspace:
