# Local testing on a PC with an NVIDIA GPU (needs the NVIDIA Container Toolkit).
# Build:   docker compose build
# Run:     docker compose up
# Open:    https://localhost:8080   (accept the self-signed cert)
# Password is set below via SELKIES_BASIC_AUTH_PASSWORD.
services:
  faceflow:
    build:
      context: .
      args:
        BASE_TAG: ${BASE_TAG:-24.04-20250101}
    image: faceflow:latest
    ports:
      - "8080:8080"   # Selkies desktop (browser)
      - "7860:7860"   # FaceFusion web UI (optional)
    environment:
      - SELKIES_BASIC_AUTH_USER=${FACEFLOW_USER:-user}
      - SELKIES_BASIC_AUTH_PASSWORD=${FACEFLOW_PASSWORD:?set FACEFLOW_PASSWORD in .env}
      - SELKIES_ENABLE_BASIC_AUTH=true
      # Bitrate/framerate tuning for the stream:
      - SELKIES_FRAMERATE=${SELKIES_FRAMERATE:-30}
      - SELKIES_VIDEO_BITRATE=${SELKIES_VIDEO_BITRATE:-8000}
    volumes:
      - faceflow-workspace:/workspace
    shm_size: "2gb"          # Chrome needs more than the 64MB default
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video]   # "video" = NVENC for the stream

volumes:
  faceflow-workspace:
