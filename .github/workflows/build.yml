name: Build FaceFlow image

# Builds both FaceFlow variants and pushes to your Docker Hub repo:
#   <user>/faceflow:kasmvnc  (KasmVNC — simple, reliable, HTTP/WebSocket)
#   <user>/faceflow:selkies  (Selkies/WebRTC — fast + audio, needs TURN)
#   <user>/faceflow:latest   (alias of :kasmvnc)
#
# One-time setup (repo -> Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME = your Docker Hub username
#   DOCKERHUB_TOKEN    = a Docker Hub access token (Read/Write)

on:
  push:
    branches:
      - claude/confident-dijkstra-crn4of
      - main
    paths:
      - "Dockerfile"
      - "Dockerfile.selkies"
      - "scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            tag: kasmvnc
            also_latest: true
          - dockerfile: Dockerfile.selkies
            tag: selkies
            also_latest: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          IMG="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/faceflow"
          TAGS="$IMG:${{ matrix.tag }}"
          if [ "${{ matrix.also_latest }}" = "true" ]; then
            TAGS="$TAGS
          $IMG:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push (${{ matrix.tag }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
