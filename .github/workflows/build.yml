name: Build FaceFlow image

# Build the Docker image in GitHub's cloud and publish it to GitHub's container
# registry (ghcr.io). No local Docker needed. No secrets to configure — the
# built-in GITHUB_TOKEN is used.

on:
  push:
    branches:
      - claude/confident-dijkstra-crn4of
      - main
    paths:
      - "Dockerfile"
      - "scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The image is large (CUDA + desktop). Reclaim disk on the runner first.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
          # If the default BASE_TAG in the Dockerfile is wrong for your driver,
          # override it here, e.g.:  build-args: BASE_TAG=24.04-20250101
