name: Build FaceFlow image

# GitHub Actions builds the image (x86_64) and pushes it to YOUR Docker Hub
# repo. No local Docker needed. The image can be a PRIVATE Docker Hub repo.
#
# One-time setup (repo -> Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME = your Docker Hub username
#   DOCKERHUB_TOKEN    = a Docker Hub access token (Read/Write)
#                        Docker Hub -> Account Settings -> Personal access tokens
#
# The image is pushed to:  docker.io/<DOCKERHUB_USERNAME>/faceflow:latest

on:
  push:
    branches:
      - claude/confident-dijkstra-crn4of
      - main
    paths:
      - "Dockerfile"
      - "scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}   # run manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The image is large (CUDA + desktop). Reclaim runner disk first.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64   # RunPod GPUs are x86_64
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/faceflow:latest
          # Override the base tag here if the Dockerfile default is wrong:
          # build-args: BASE_TAG=24.04-20250101
